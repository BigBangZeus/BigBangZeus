<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="BIGBANGZEUS - full-stack developer terminal banner">
  <title>BIGBANGZEUS // full-stack developer</title>

  <defs>
    <!-- amber phosphor glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT scanlines -->
    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.5" fill="#000000" opacity="0.30"/>
    </pattern>

    <!-- screen curvature vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <!-- moving refresh sweep -->
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffd166" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="barfill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c98a00"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>

    <clipPath id="screen">
      <rect x="8" y="8" width="984" height="264" rx="10"/>
    </clipPath>

    <!-- typewriter reveal masks (generously wide; reveal is left-to-right) -->
    <clipPath id="clipL1"><rect class="rv l1" x="30" y="52"  width="640" height="26"/></clipPath>
    <clipPath id="clipL2"><rect class="rv l2" x="30" y="196" width="640" height="26"/></clipPath>
    <clipPath id="clipWM"><rect class="rv wm" x="30" y="88"  width="940" height="62"/></clipPath>
  </defs>

  <style>
    /* ---- 9s master cycle; every element keys off the same timeline ---- */
    .rv {
      transform: scaleX(0);
      transform-box: fill-box;
      transform-origin: left center;
    }
    .l1 { animation: typeL1 9s steps(36) infinite; }
    .wm { animation: typeWM 9s steps(11) infinite; }
    .l2 { animation: typeL2 9s steps(35) infinite; }

    @keyframes typeL1 {
      0%,2%    { transform: scaleX(0); }
      15%,100% { transform: scaleX(1); }
    }
    @keyframes typeWM {
      0%,18%   { transform: scaleX(0); }
      30%,100% { transform: scaleX(1); }
    }
    @keyframes typeL2 {
      0%,42%   { transform: scaleX(0); }
      55%,100% { transform: scaleX(1); }
    }

    .sub { opacity: 0; animation: fadeSub 9s ease-out infinite; }
    @keyframes fadeSub {
      0%,32%   { opacity: 0; }
      40%,100% { opacity: 0.82; }
    }

    .barmask {
      transform: scaleX(0);
      transform-box: fill-box;
      transform-origin: left center;
      animation: fill 9s cubic-bezier(.2,.8,.3,1) infinite;
    }
    @keyframes fill {
      0%,57%   { transform: scaleX(0); }
      74%,100% { transform: scaleX(1); }
    }

    .okline { opacity: 0; animation: okIn 9s infinite; }
    @keyframes okIn {
      0%,75%    { opacity: 0; }
      78%       { opacity: 1; }
      82%       { opacity: 0.25; }
      86%,100%  { opacity: 1; }
    }

    /* block cursor — only present once line 2 begins typing */
    .cursor { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    .curwrap { opacity: 0; animation: curIn 9s steps(1) infinite; }
    @keyframes curIn { 0%,42% { opacity: 0; } 42.01%,100% { opacity: 1; } }

    /* scanline drift */
    .scan { animation: drift 1.1s linear infinite; }
    @keyframes drift { to { transform: translateY(3px); } }

    /* refresh sweep travelling down the tube */
    .sweep { animation: sweepdown 4.6s linear infinite; }
    @keyframes sweepdown {
      0%   { transform: translateY(-70px); }
      100% { transform: translateY(290px); }
    }

    /* CRT instability */
    .tube { animation: flicker 3.7s ease-in-out infinite; }
    @keyframes flicker {
      0%,100% { opacity: 1; }
      42%     { opacity: 0.965; }
      44%     { opacity: 1; }
      77%     { opacity: 0.94; }
      79%     { opacity: 1; }
    }

    text { font-family: "Courier New", Courier, "DejaVu Sans Mono", monospace; }
  </style>

  <!-- ================= tube ================= -->
  <g class="tube">
    <rect x="0" y="0" width="1000" height="280" rx="12" fill="#0d0900"/>
    <rect x="8" y="8" width="984" height="264" rx="10" fill="#140c00"
          stroke="#ffb000" stroke-opacity="0.34" stroke-width="1"/>

    <g clip-path="url(#screen)">

      <!-- title bar -->
      <rect x="8" y="8" width="984" height="30" fill="#1c1000"/>
      <line x1="8" y1="38" x2="992" y2="38" stroke="#ffb000" stroke-opacity="0.22"/>
      <circle cx="30" cy="23" r="4.5" fill="#ffb000" fill-opacity="0.85"/>
      <circle cx="48" cy="23" r="4.5" fill="#ffb000" fill-opacity="0.50"/>
      <circle cx="66" cy="23" r="4.5" fill="#ffb000" fill-opacity="0.28"/>
      <text x="500" y="27" font-size="12" fill="#c98a00" text-anchor="middle" letter-spacing="1.6">
        bigbangzeus — zsh — 132×34
      </text>

      <!-- line 1 -->
      <g clip-path="url(#clipL1)">
        <text x="30" y="70" font-size="16" fill="#ffb000" filter="url(#softglow)" xml:space="preserve">root@bigbangzeus:~$ ./init --profile</text>
      </g>

      <!-- wordmark -->
      <g clip-path="url(#clipWM)">
        <text x="30" y="136" font-size="58" font-weight="bold" fill="#ffc947"
              filter="url(#glow)" letter-spacing="9" xml:space="preserve">BIGBANGZEUS</text>
      </g>

      <!-- subtitle -->
      <text class="sub" x="34" y="166" font-size="13.5" fill="#ffb000" letter-spacing="3.1">
        FULL-STACK DEV // SYSTEMS // PERFORMANCE // CHI &lt;-&gt; TPA
      </text>

      <!-- line 2 -->
      <g clip-path="url(#clipL2)">
        <text x="30" y="214" font-size="16" fill="#ffb000" filter="url(#softglow)" xml:space="preserve">root@bigbangzeus:~$ ./deploy --prod</text>
      </g>
      <g class="curwrap">
        <rect class="cursor" x="370" y="201" width="9" height="17" fill="#ffd166"/>
      </g>

      <!-- progress bar -->
      <rect x="30" y="236" width="600" height="10" rx="5"
            fill="#000000" fill-opacity="0.55" stroke="#ffb000" stroke-opacity="0.34"/>
      <rect class="barmask" x="32" y="238" width="596" height="6" rx="3" fill="url(#barfill)"/>

      <text class="okline" x="648" y="245" font-size="13" fill="#ffd166"
            filter="url(#softglow)" letter-spacing="2">[ OK ] ALL SYSTEMS OPERATIONAL</text>

      <!-- overlays -->
      <g class="sweep">
        <rect x="8" y="0" width="984" height="70" fill="url(#sweep)"/>
      </g>
      <rect class="scan" x="8" y="-4" width="984" height="284" fill="url(#scanlines)"/>
      <rect x="8" y="8" width="984" height="264" rx="10" fill="url(#vignette)"/>
    </g>
  </g>
</svg>
