<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 10" width="1000" height="10" role="img" aria-label="divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffb000" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#ffb000" stop-opacity="0.55"/>
      <stop offset="82%"  stop-color="#ffb000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffd166" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffe9b0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <style>
    .trav { animation: run 4.2s cubic-bezier(.55,0,.45,1) infinite; }
    @keyframes run {
      0%   { transform: translateX(-260px); }
      100% { transform: translateX(1000px); }
    }
  </style>
  <rect x="0" y="4.2" width="1000" height="1.6" fill="url(#base)"/>
  <g class="trav">
    <rect x="0" y="3.4" width="260" height="3.2" fill="url(#pulse)" filter="url(#dg)"/>
  </g>
</svg>
