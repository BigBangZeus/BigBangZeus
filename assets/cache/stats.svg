<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="system_monitor — BigBangZeus">
<title>system_monitor — BigBangZeus</title>
  <defs>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sl" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.5" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <clipPath id="cp"><rect x="8" y="8" width="984" height="284" rx="10"/></clipPath>
  </defs>
  <style>
    text { font-family: "Courier New", Courier, "DejaVu Sans Mono", monospace; }
    .row { opacity: 0; animation: fin 7s ease-out infinite; }
    @keyframes fin {
      0%,5% { opacity: 0; transform: translateX(-5px); }
      12%,93% { opacity: 1; transform: translateX(0); }
      100% { opacity: 0; transform: translateX(-5px); }
    }
    .bar { transform: scaleX(0); transform-box: fill-box; transform-origin: left center;
           animation: grow 7s cubic-bezier(.2,.8,.3,1) infinite; }
    @keyframes grow { 0%,14% { transform: scaleX(0); } 34%,93% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .scan { animation: drift 1.1s linear infinite; }
    @keyframes drift { to { transform: translateY(3px); } }
    .cur { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 0%,50%{opacity:1} 50.01%,100%{opacity:0} }
    .tube { animation: fl 4.1s ease-in-out infinite; }
    @keyframes fl { 0%,100%{opacity:1} 40%{opacity:.96} 42%{opacity:1} 74%{opacity:.94} 76%{opacity:1} }
  </style>
<g class="tube">
  <rect width="1000" height="300" rx="12" fill="#0d0900"/>
  <rect x="8" y="8" width="984" height="284" rx="10" fill="#140c00" stroke="#ffb000" stroke-opacity="0.34"/>
  <g clip-path="url(#cp)">
    <rect x="8" y="8" width="984" height="30" fill="#1c1000"/>
    <line x1="8" y1="38" x2="992" y2="38" stroke="#ffb000" stroke-opacity="0.22"/>
    <circle cx="30" cy="23" r="4.5" fill="#ffb000" fill-opacity="0.85"/>
    <circle cx="48" cy="23" r="4.5" fill="#ffb000" fill-opacity="0.5"/>
    <circle cx="66" cy="23" r="4.5" fill="#ffb000" fill-opacity="0.28"/>
    <text x="500" y="27" font-size="12" fill="#c98a00" text-anchor="middle" letter-spacing="1.6">system_monitor — BigBangZeus</text>

    <text class="row" x="34" y="52" font-size="12" fill="#8a5f00" letter-spacing="2.6">ACCOUNT</text>
    <text class="row" x="470" y="52" font-size="12" fill="#8a5f00" letter-spacing="2.6">LANGUAGE DISTRIBUTION</text>
    
    <g class="row" style="animation-delay:0.10s">
      <text x="34" y="72" font-size="14.5" fill="#c98a00">uptime</text>
      <text x="176" y="72" font-size="14.5" fill="#ffb000">2y 8m</text>
    </g>
    <g class="row" style="animation-delay:0.19s">
      <text x="34" y="98" font-size="14.5" fill="#c98a00">repos</text>
      <text x="176" y="98" font-size="14.5" fill="#ffb000">3</text>
    </g>
    <g class="row" style="animation-delay:0.28s">
      <text x="34" y="124" font-size="14.5" fill="#c98a00">stars</text>
      <text x="176" y="124" font-size="14.5" fill="#ffb000">0</text>
    </g>
    <g class="row" style="animation-delay:0.37s">
      <text x="34" y="150" font-size="14.5" fill="#c98a00">forks</text>
      <text x="176" y="150" font-size="14.5" fill="#ffb000">0</text>
    </g>
    <g class="row" style="animation-delay:0.46s">
      <text x="34" y="176" font-size="14.5" fill="#c98a00">followers</text>
      <text x="176" y="176" font-size="14.5" fill="#ffb000">1</text>
    </g>
    <g class="row" style="animation-delay:0.55s">
      <text x="34" y="202" font-size="14.5" fill="#c98a00">following</text>
      <text x="176" y="202" font-size="14.5" fill="#ffb000">2</text>
    </g>
    <g class="row" style="animation-delay:0.64s">
      <text x="34" y="228" font-size="14.5" fill="#c98a00">languages</text>
      <text x="176" y="228" font-size="14.5" fill="#ffb000">4</text>
    </g>
    <g class="row" style="animation-delay:0.73s">
      <text x="34" y="254" font-size="14.5" fill="#c98a00">since</text>
      <text x="176" y="254" font-size="14.5" fill="#ffb000">2024-01-16</text>
    </g>
    <g class="row" style="animation-delay:0.50s">
      <text x="470" y="72" font-size="13.5" fill="#c98a00">TypeScript</text>
      <rect x="596" y="60" width="300" height="11" rx="5.5" fill="#000" fill-opacity="0.5" stroke="#ffb000" stroke-opacity="0.25"/>
      <rect class="bar" style="animation-delay:0.50s" x="598" y="62" width="199" height="7" rx="3.5" fill="#ffb000"/>
      <text x="964" y="72" font-size="12" fill="#ffd166" text-anchor="end">66.3%</text>
    </g>
    <g class="row" style="animation-delay:0.61s">
      <text x="470" y="102" font-size="13.5" fill="#c98a00">JavaScript</text>
      <rect x="596" y="90" width="300" height="11" rx="5.5" fill="#000" fill-opacity="0.5" stroke="#ffb000" stroke-opacity="0.25"/>
      <rect class="bar" style="animation-delay:0.61s" x="598" y="92" width="94" height="7" rx="3.5" fill="#ffb000"/>
      <text x="964" y="102" font-size="12" fill="#ffd166" text-anchor="end">31.4%</text>
    </g>
    <g class="row" style="animation-delay:0.72s">
      <text x="470" y="132" font-size="13.5" fill="#c98a00">HTML</text>
      <rect x="596" y="120" width="300" height="11" rx="5.5" fill="#000" fill-opacity="0.5" stroke="#ffb000" stroke-opacity="0.25"/>
      <rect class="bar" style="animation-delay:0.72s" x="598" y="122" width="5" height="7" rx="3.5" fill="#ffb000"/>
      <text x="964" y="132" font-size="12" fill="#ffd166" text-anchor="end">1.6%</text>
    </g>
    <g class="row" style="animation-delay:0.83s">
      <text x="470" y="162" font-size="13.5" fill="#c98a00">CSS</text>
      <rect x="596" y="150" width="300" height="11" rx="5.5" fill="#000" fill-opacity="0.5" stroke="#ffb000" stroke-opacity="0.25"/>
      <rect class="bar" style="animation-delay:0.83s" x="598" y="152" width="3" height="7" rx="3.5" fill="#ffb000"/>
      <text x="964" y="162" font-size="12" fill="#ffd166" text-anchor="end">0.7%</text>
    </g>
    <rect class="cur" x="34" y="272" width="9" height="14" fill="#ffd166"/>
    <text x="52" y="284" font-size="12" fill="#8a5f00">refreshed daily via github actions</text>
    <rect class="scan" x="8" y="-4" width="984" height="308" fill="url(#sl)"/>
    <rect x="8" y="8" width="984" height="284" rx="10" fill="url(#vig)"/>
  </g>
</g>
</svg>