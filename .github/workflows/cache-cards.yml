name: cache-cards

# Generates the amber stat cards and commits them.
#
# HISTORY / WHY: this originally fetched github-readme-stats and
# github-profile-trophy. Both public instances are now DEAD —
#   github-readme-stats.vercel.app  -> 503 DEPLOYMENT_PAUSED
#   github-profile-trophy.vercel.app -> 402 DEPLOYMENT_DISABLED
# so the cards are generated locally from the GitHub API instead.
# scripts/gen-cards.mjs owns that. No third-party runtime dependency.

on:
  schedule:
    - cron: "17 5 * * *"      # daily 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/cache/**"     # don't retrigger on our own commit

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Hard failure if this breaks. The previous version swallowed errors and
      # reported success while writing nothing — that is what hid the outage.
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER:  ${{ github.repository_owner }}
        run: node scripts/gen-cards.mjs

      - name: Verify cards were actually written
        run: |
          fail=0
          for f in assets/cache/stats.svg assets/cache/achievements.svg; do
            if [ ! -s "$f" ] || ! head -c 200 "$f" | grep -q "<svg"; then
              echo "::error::$f missing or not valid SVG"; fail=1
            else
              echo "ok $f ($(stat -c%s "$f") bytes)"
            fi
          done
          exit $fail

      # Bonus card from a third party. Allowed to fail — but LOUDLY, and we
      # keep the last good copy rather than overwriting it with an error page.
      - name: Fetch streak card (non-fatal)
        run: |
          U="${{ github.repository_owner }}"
          URL="https://streak-stats.demolab.com/?user=$U&background=140c00&border=8a5f00&stroke=8a5f00&ring=ffb000&fire=ffd166&currStreakLabel=ffb000&sideLabels=c98a00&currStreakNum=ffd166&sideNums=ffb000&dates=8a5f00"
          if curl -fsSL --max-time 45 -o /tmp/streak.svg "$URL" \
             && head -c 200 /tmp/streak.svg | grep -q "<svg" \
             && [ "$(stat -c%s /tmp/streak.svg)" -gt 700 ]; then
            mv /tmp/streak.svg assets/cache/streak.svg
            echo "ok streak ($(stat -c%s assets/cache/streak.svg) bytes)"
          else
            echo "::warning::streak-stats.demolab.com unreachable — keeping previous copy. If this warns repeatedly the service has died like the others; drop the streak card from README.md."
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cache
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh profile cards [skip ci]"
          git push
