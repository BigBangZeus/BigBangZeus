name: snake

# Renders your contribution graph as a snake eating your commits.
# Output is committed to the `output` branch, so it is served from GitHub's
# CDN — no third-party runtime dependency, nothing to rate-limit.

# DISPATCH-ONLY. The README no longer displays the snake — it was replaced by
# assets/dotfield.svg, a purely decorative animation — so running this on a
# schedule would burn CI minutes and force-push the `output` branch for an
# image nothing references. Left intact rather than deleted: hit "Run workflow"
# in the Actions tab to regenerate, then restore the <img> tag in README.md.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Needed for scripts/strip-snake-bar.mjs — snk itself does not require it.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # NOTE: every colour needs the leading '#'. Omitting it on color_snake
          # emitted `--cs:ffb000`, an invalid CSS colour, so the snake rendered
          # with no fill (it looked like black squares crawling the grid).
          # Level-0 dot brightened from #140c00 -> #2b1d00 so the empty grid is
          # actually legible against GitHub's #0d1117 page background.
          outputs: |
            dist/snake-amber.svg?color_snake=#ffb000&color_dots=#2b1d00,#7a4d00,#c98a00,#ffb000,#ffd166
            dist/snake-amber-dark.svg?color_snake=#ffd166&color_dots=#1a1200,#6b4200,#c98a00,#ffb000,#ffe9b0

      # snk draws a solid progress bar under the grid. It fills almost instantly
      # at a low contribution count and just sits there dominating the image.
      #
      # Platane/snk@v3 is a Docker container action: it runs as root, so the
      # files it writes into dist/ are owned by root. This `run:` step executes
      # as the `runner` user, which can read them but gets EACCES on write.
      # That is how the first attempt at this step failed. Take ownership first.
      # The `ls -la` stays so the log shows real ownership if this recurs.
      - name: Strip progress bar
        run: |
          ls -la dist
          sudo chown -R "$(id -u):$(id -g)" dist
          node scripts/strip-snake-bar.mjs dist/snake-amber.svg dist/snake-amber-dark.svg

      - name: Verify output
        run: |
          fail=0
          for f in dist/snake-amber.svg dist/snake-amber-dark.svg; do
            if [ ! -s "$f" ] || ! head -c 200 "$f" | grep -q "<svg"; then
              echo "::error::$f missing or not valid SVG"; fail=1; continue
            fi
            # A colour without '#' silently renders the snake unfilled.
            if grep -qE '\-\-cs:[^#]' "$f"; then
              echo "::error::$f has an invalid --cs colour (missing '#')"; fail=1
            fi
            # The strip script returns 0 when its regex finds nothing, so without
            # this the step would pass while the bar was still present.
            if grep -q 'class="u u' "$f"; then
              echo "::error::$f still contains an snk progress bar — strip did not apply"; fail=1
            fi
            # Cropping the viewBox is what proves the strip actually ran.
            if grep -qE 'viewBox="[-0-9.]+ [-0-9.]+ [0-9.]+ 192"' "$f"; then
              echo "::error::$f viewBox still 192 tall — crop did not apply"; fail=1
            fi
            echo "ok $f ($(stat -c%s "$f") bytes)"
          done
          exit $fail

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
