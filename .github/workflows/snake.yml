name: snake

# Renders your contribution graph as a snake eating your commits.
# Output is committed to the `output` branch, so it is served from GitHub's
# CDN — no third-party runtime dependency, nothing to rate-limit.

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-amber.svg?color_snake=ffb000&color_dots=#140c00,#6b4200,#c98a00,#ffb000,#ffd166
            dist/snake-amber-dark.svg?palette=github-dark&color_snake=ffd166

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
